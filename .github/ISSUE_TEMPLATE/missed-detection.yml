name: Missed detection
description: A framework did something the rules did not catch, or a rule cannot fire.
title: "Missed: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not paste customer data, real user names, internal host names or internal addresses.
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options: [ARTEX or AntiFox, Cairn, PentAGI, HexStrike, CyberStrikeAI, Strix, Hermes Agent, Agent Zero, RedAmon, Xalgorix, Pentest Swarm AI, Shared behavior, Other]
    validations:
      required: true
  - type: textarea
    id: activity
    attributes:
      label: What happened
      description: The request, command line or event that should have matched, with real values replaced.
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule that should have fired
      description: Optional. File path, SID or title.
  - type: input
    id: source
    attributes:
      label: Source
      description: A link to the framework's code or a public report, if there is one.
