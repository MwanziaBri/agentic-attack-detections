# Agentic Attack Detections for Splunk. Built by tools/build_splunk.py from https://github.com/ThreatDefence/agentic-attack-detections
# Do not edit here: change the Sigma rule, frameworks/artex/splunk/ or tools/build_splunk.py and rebuild.
# Point aad_indexes at your indexes. Change a data source macro if your data is not tagged for the CIM.

# The indexes every search reads. Ships as index=* so the searches run on install. Narrow it to the indexes that
# hold your endpoint, web, DNS and cloud logs before you enable a search: index=* scans every index on every run.
[aad_indexes]
definition = index=*

# Process starts (CIM Endpoint.Processes: Sysmon event 1, Windows 4688, Linux auditd or Sysmon for Linux, EDR).
[aad_process]
definition = `aad_indexes` tag=process tag=report

# File creation (CIM Endpoint.Filesystem: Sysmon event 11, EDR).
[aad_file]
definition = `aad_indexes` tag=endpoint tag=filesystem

# Registry writes (CIM Endpoint.Registry: Sysmon events 12 to 14, EDR).
[aad_registry]
definition = `aad_indexes` tag=endpoint tag=registry

# DNS queries (CIM Network_Resolution: Sysmon event 22, DNS server, Zeek dns.log).
[aad_dns]
definition = `aad_indexes` tag=network tag=resolution tag=dns

# Outbound web proxy and secure web gateway logs (CIM Web).
[aad_proxy]
definition = `aad_indexes` tag=web tag=proxy

# Web server, load balancer and WAF access logs for your own sites (CIM Web).
[aad_web]
definition = `aad_indexes` tag=web NOT tag=proxy

# AWS CloudTrail (Splunk Add-on for AWS).
[aad_aws_cloudtrail]
definition = `aad_indexes` sourcetype=aws:cloudtrail

# Entra ID sign-ins.
[aad_azure_signin]
definition = `aad_indexes` (sourcetype=azure:aad:signin OR sourcetype=ms:aad:signin OR (sourcetype=mscs:azure:eventhub category=SignInLogs))

# Entra ID audit log.
[aad_azure_audit]
definition = `aad_indexes` (sourcetype=azure:aad:audit OR sourcetype=ms:aad:audit OR (sourcetype=mscs:azure:eventhub category=AuditLogs))

# Azure activity log.
[aad_azure_activity]
definition = `aad_indexes` (sourcetype=azure:monitor:activity OR (sourcetype=mscs:azure:eventhub category=Administrative))

# Okta system log.
[aad_okta]
definition = `aad_indexes` (sourcetype=OktaIM2:log OR sourcetype=okta:im2)

# Events searched for reported addresses: network traffic, web, sign-ins and CloudTrail.
[aad_network]
definition = `aad_indexes` (tag=network OR tag=web OR tag=authentication OR sourcetype=aws:cloudtrail)

# Events searched for reported domains: DNS and web.
[aad_domains]
definition = `aad_indexes` ((tag=network tag=resolution tag=dns) OR tag=web)

# Events searched for reported file hashes.
[aad_hashes]
definition = `aad_indexes` ((tag=process tag=report) OR (tag=endpoint tag=filesystem))

# Events searched for reported user agents.
[aad_user_agents]
definition = `aad_indexes` (tag=web OR tag=authentication OR sourcetype=aws:cloudtrail OR sourcetype=OktaIM2:log)

# The host or address a result is about: the source for web, sign-in and cloud events, the machine for endpoint events.
[aad_entity]
definition = eval aad_entity=coalesce(aad_entity, src, src_ip, clientip, c_ip, sourceIPAddress, ipAddress, IPAddress, callerIpAddress, 'client.ipAddress', 'userIdentity.arn', caller, dest, dest_host, Computer, host)

# Indicators past their review date are leads to recheck, not matches.
[aad_active_indicator]
definition = where isnull(review_by) OR review_by="" OR strptime(review_by, "%Y-%m-%d") >= relative_time(now(), "-1d@d")

# Macros used by the hand-written ARTEX searches. artex_indexes follows aad_indexes.
[artex_indexes]
definition = `aad_indexes`

[artex_cloudtrail]
definition = `artex_indexes` sourcetype=aws:cloudtrail

[artex_azure_audit]
definition = `artex_indexes` (sourcetype=azure:aad:audit OR sourcetype=ms:aad:audit OR sourcetype=mscs:azure:eventhub category=AuditLogs)

[artex_azure_activity]
definition = `artex_indexes` (sourcetype=azure:monitor:activity OR sourcetype=mscs:azure:eventhub category=Administrative)

[artex_keyvault]
definition = `artex_indexes` (sourcetype=azure:monitor:resource OR sourcetype=mscs:azure:eventhub) category=AuditEvent

[artex_web_raw]
definition = `artex_indexes` (sourcetype=access_combined OR sourcetype=iis OR sourcetype=nginx:plus:access OR sourcetype=aws:elb:accesslogs OR sourcetype=azure:waf)

[artex_ua_terms]
definition = ("*artex-readonly/*" OR "*artex-pentest/*" OR "*artex-audit/*" OR "*artex-verify/*" OR "*artex-spawn/*" OR "*ARTEX-worker/*" OR "*artex-enrich/*" OR "*artex-i21861-canary*" OR "*artex-agent*" OR "*artex-judge-*" OR "*ARTeX-authorized-pentest*" OR "*Mozilla/5.0 ARTeX*" OR "*Mozilla/5.0 (ARTEX)*" OR "*ArtExVerify/*" OR "*ArtEx/1.0*" OR "*scopeweaver*" OR "*spa-api-recon*")
