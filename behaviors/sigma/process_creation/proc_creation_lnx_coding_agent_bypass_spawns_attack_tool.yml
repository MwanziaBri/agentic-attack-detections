title: AI Agent CLI Starts an Attack Tool
id: 88fc59b1-a5c1-5229-9753-e11f9a5c4fc0
status: experimental
description: |
    Detects an attack tool whose parent is an AI agent CLI or the shell Claude Code runs commands through
    (zsh -c source ~/.claude/shell-snapshots/... on Linux and macOS, the CLAUDE_CODE_SHELL_LAUNCHER_SCRIPT PowerShell
    launcher on Windows). Auto-approve flags are not part of the rule: staff use them too, and an agent can run an
    attack tool without one. Qwen Code, Kimi CLI, Codex and opencode start tools through a plain shell, which puts the
    agent one level above the parent, so this rule only sees them when they start the tool directly; the KQL hunt in
    behaviors/sentinel/hunting covers the grandparent. The model behind the agent does not matter.
    Tools written in Python, Ruby or Perl (sqlmap, NetExec, Metasploit, nikto and others) run under their interpreter,
    so the image is python3, ruby or perl and the tool is the script in the command line; the script selections cover
    them. A tool started as a module (python3 -m) is not covered.
    Agents installed with npm or pip run under node or python and are found by their package path in the parent
    command line.
references:
    - https://github.com/oritera/Cairn
    - https://github.com/QwenLM/qwen-code
    - https://github.com/MoonshotAI/kimi-cli
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-21
modified: 2026-11-23
tags:
    - attack.execution
    - attack.t1059
    - attack.discovery
    - attack.t1046
logsource:
    category: process_creation
detection:
    selection_tool:
        Image|endswith:
            - '/nmap'
            - '\nmap.exe'
            - '/naabu'
            - '\naabu.exe'
            - '/masscan'
            - '\masscan.exe'
            - '/nuclei'
            - '\nuclei.exe'
            - '/katana'
            - '\katana.exe'
            - '/dalfox'
            - '\dalfox.exe'
            - '/ffuf'
            - '\ffuf.exe'
            - '/gobuster'
            - '\gobuster.exe'
            - '/feroxbuster'
            - '\feroxbuster.exe'
            - '/sqlmap'
            - '\sqlmap.exe'
            - '/nikto'
            - '\nikto.exe'
            - '/wpscan'
            - '\wpscan.exe'
            - '/hydra'
            - '\hydra.exe'
            - '/kerbrute'
            - '\kerbrute.exe'
            - '/netexec'
            - '\netexec.exe'
            - '/nxc'
            - '\nxc.exe'
            - '/crackmapexec'
            - '\crackmapexec.exe'
            - '/bloodyAD'
            - '\bloodyAD.exe'
            - '/coercer'
            - '\coercer.exe'
            - '/chisel'
            - '\chisel.exe'
            - '/evil-winrm'
            - '\evil-winrm.exe'
            - '/cloudfox'
            - '\cloudfox.exe'
            - '/msfconsole'
            - '\msfconsole.exe'
            - '/dirsearch'
            - '\dirsearch.exe'
            - '/medusa'
            - '\medusa.exe'
            - '/enum4linux-ng'
            - '\enum4linux-ng.exe'
            - '/pwncat'
            - '\pwncat.exe'
            - '/pwncat-cs'
            - '\pwncat-cs.exe'
            - '/responder'
            - '\responder.exe'
            - '/searchsploit'
            - '\searchsploit.exe'
            - '/hashcat'
            - '\hashcat.exe'
    selection_script_interpreter:
        # A script tool started by name runs as its interpreter: python3.12, ruby3.3, perl
        Image|contains:
            - '/python'
            - '\python'
            - '/ruby'
            - '\ruby'
            - '/perl'
            - '\perl'
    selection_script_tool:
        # The tool as the script that is run: its path followed by an argument, or at the end of the command line.
        # A folder or file that only has a tool name in it (src/responder/handler.py, /srv/nxcloud) does not match
        - CommandLine|contains:
              - '/sqlmap '
              - '/nikto '
              - '/wpscan '
              - '/netexec '
              - '/nxc '
              - '/crackmapexec '
              - '/bloodyAD '
              - '/coercer '
              - '/evil-winrm '
              - '/msfconsole '
              - '/dirsearch '
              - '/enum4linux-ng '
              - '/pwncat '
              - '/pwncat-cs '
              - '/responder '
              - '/sqlmap.py'
              - '\sqlmap.py'
              - ' sqlmap.py'
              - '/nikto.pl'
              - '\nikto.pl'
              - ' nikto.pl'
              - '/bloodyAD.py'
              - '\bloodyAD.py'
              - ' bloodyAD.py'
              - '/dirsearch.py'
              - '\dirsearch.py'
              - ' dirsearch.py'
              - '/enum4linux-ng.py'
              - '\enum4linux-ng.py'
              - ' enum4linux-ng.py'
              - '/Coercer/Coercer.py'
              - ' Coercer/Coercer.py'
              - '\Coercer\Coercer.py'
              - ' Coercer\Coercer.py'
              - '/Responder/Responder.py'
              - ' Responder/Responder.py'
              - '\Responder\Responder.py'
              - ' Responder\Responder.py'
        - CommandLine|endswith:
              - '/sqlmap'
              - '/nikto'
              - '/wpscan'
              - '/netexec'
              - '/nxc'
              - '/crackmapexec'
              - '/bloodyAD'
              - '/coercer'
              - '/evil-winrm'
              - '/msfconsole'
              - '/dirsearch'
              - '/enum4linux-ng'
              - '/pwncat'
              - '/pwncat-cs'
              - '/responder'
    selection_agent_shell:
        ParentCommandLine|contains:
            - 'shell-snapshots'
            - 'CLAUDE_CODE_SHELL_LAUNCHER_SCRIPT'
            - '--provider cairn'
            - '/tmp/cairn-pi/'
    selection_agent_parent:
        ParentImage|endswith:
            - '/claude'
            - '\claude.exe'
            - '/codex'
            - '\codex.exe'
            - '/qwen'
            - '\qwen.exe'
            - '/kimi'
            - '\kimi.exe'
            - '/opencode'
            - '\opencode.exe'
            - '/hermes'
            - '\hermes.exe'
    selection_agent_package:
        # The agent runs under node, bun or python: the parent image is the runtime, the package path names the agent
        ParentCommandLine|contains:
            - '@anthropic-ai/claude-code'
            - '@anthropic-ai\claude-code'
            - '@qwen-code/'
            - '@qwen-code\'
            - '@openai/codex'
            - '@openai\codex'
            - 'opencode-ai'
            - 'kimi-cli'
            - 'kimi_cli'
    condition: (selection_tool or (selection_script_interpreter and selection_script_tool)) and 1 of selection_agent_*
falsepositives:
    - Staff who use an AI agent for authorized security testing or network troubleshooting
level: medium
