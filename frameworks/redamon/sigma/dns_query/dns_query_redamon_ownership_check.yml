title: RedAmon Ownership Check Lookup
id: 6eacd941-72ba-5db7-b745-816079cf5127
status: experimental
description: |
    Detects a DNS lookup for _redamon-verify.<domain>, the TXT record RedAmon reads when a project turns on ownership
    verification. On your resolver it means a host of yours runs RedAmon. On the name servers of your own domain it
    means someone set up a RedAmon project for that domain.
references:
    - https://github.com/samugit83/redamon
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-23
tags:
    - attack.reconnaissance
    - attack.t1590.002
logsource:
    category: dns_query
detection:
    selection:
        QueryName|startswith: '_redamon-verify.'
    condition: selection
falsepositives:
    - Authorized tests with RedAmon
level: low
