title: RedAmon User Agent or Canary in Web Logs
id: 0e549584-b7f1-5c5a-8172-c9f4f328c970
status: experimental
description: |
    Detects RedAmon's self-naming user agents (RedAmon-AISurfaceRecon/1.0, RedAmon-CachePoison/1.0 and the
    "compatible; RedAmon" strings), the XSS canary rEdAm0n1337XsS its agent is told to use in every parameter, and the
    rdmncb cache buster of its cache poisoning tests. All are defaults of the published code.
references:
    - https://github.com/samugit83/redamon
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-23
tags:
    - attack.reconnaissance
    - attack.t1595.002
    - attack.initial-access
    - attack.t1190
logsource:
    category: webserver
detection:
    selection_ua:
        cs-user-agent|contains: 'RedAmon'
    selection_canary:
        cs-uri-query|contains:
            - 'rEdAm0n1337XsS'
            - 'rdmncb=cb'
    selection_referer:
        cs-referer|contains: 'rEdAm0n1337XsS'
    condition: 1 of selection_*
falsepositives:
    - Authorized tests with RedAmon
level: high
